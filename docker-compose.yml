services:
  open-meteo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-meteo-mcp:1.0.0
    container_name: open-meteo-mcp
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Inside the container the process must bind all interfaces; the published
      # port below decides what is actually reachable from outside.
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      # Where the periodic collector writes watches.json and samples/. Must match
      # the volume mount below, and must be writable — the root filesystem is
      # read-only, so without this mount the watch tools disable themselves.
      WATCH_DATA_DIR: /app/data

    # Publish on loopback only. Put nginx/Caddy/Traefik in front for TLS, and
    # change this to "3000:3000" only if the network itself is trusted.
    ports:
      - "127.0.0.1:3000:3000"

    # The collected history lives here, so it survives `docker compose up --build`
    # and is directly readable on the host:
    #   cat data/samples/<watch-id>.json | jq .samples[-1]
    #
    # The container runs as uid 1000 (`node`), so the host directory must be
    # writable by that uid:
    #   mkdir -p data && sudo chown 1000:1000 data
    volumes:
      - ./data:/app/data

    # If a token is set but you still want a hard guard against accidentally
    # exposing the service, keep this assertion enabled: the container refuses
    # to start when no token is configured.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Everything except the data volume stays read-only: the image itself is never
    # written to, and /tmp is a private tmpfs for the runtime's scratch use.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
